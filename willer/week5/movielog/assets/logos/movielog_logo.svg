<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Simple Clapperboard using basic shapes -->
  <rect x="20" y="45" width="80" height="55" rx="4" fill="#1C1B1F" />
  <rect x="20" y="30" width="80" height="12" rx="2" fill="#1C1B1F" />
  <!-- Stripes on the clapper top -->
  <path d="M30 30 L40 42 M50 30 L60 42 M70 30 L80 42 M90 30 L100 42" stroke="#FDFCF8" stroke-width="4" />
  <!-- Clapper hinge circle -->
  <circle cx="20" cy="36" r="3" fill="#6750A4" />
  <!-- Symbol/Play icon on the body -->
  <path d="M55 65 L70 72.5 L55 80 Z" fill="#6750A4" />
</svg>